- name: "Kanchenjunga Eco Retreat"
  location: "Pelling"
  features: ["solar power", "composting", "bamboo construction", "local employment"]
  description: "Built entirely with locally sourced bamboo and sustainable materials, this retreat offers spectacular mountain views while running almost entirely on solar energy."
  image: "/assets/images/eco-lodge.png"

- name: "Bamboo Grove Haven"
  location: "Gangtok"
  features: ["rainwater harvesting", "solar water heating", "organic garden", "waste recycling"]
  description: "A peaceful sanctuary near the bustling capital. The property champions zero-waste practices and maintains a lush organic vegetable garden that supplies its kitchen."
  image: "/assets/images/eco-lodge.png"

- name: "Brahmaputra Jungle Resort"
  location: "Kaziranga"
  features: ["solar power", "wildlife conservation fund", "local employment", "plastic-free"]
