  image: "/assets/images/eco-lodge.png"

- name: "Heritage Tea Bungalows"
  location: "Jorhat (Assam)"
  features: ["heritage conservation", "rainwater harvesting", "organic garden", "community outreach"]
  description: "Preserving the rich architectural heritage of Assam, these restored bungalows focus on sustainable operations and fund education programs for the tea workers' children."
  image: "/assets/images/eco-lodge.png"

- name: "Lachung Alpine Camp"
  location: "Lachung"
  features: ["solar power", "bamboo construction", "composting", "local employment"]
